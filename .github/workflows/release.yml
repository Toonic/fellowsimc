name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build
        run: msbuild simc_vs2026.sln /p:Configuration=Release /p:Platform=x64

      - name: Package build
        shell: pwsh
        run: |
          mkdir release-package
          copy bin\x64\Release\simc.exe release-package\
          copy start_ui.bat release-package\
          New-Item -ItemType Directory -Force -Path release-package\apl
          Get-ChildItem -Path apl -Exclude "development" | Copy-Item -Destination release-package\apl -Recurse -Force
          if (Test-Path profiles) { Copy-Item -Recurse profiles release-package\profiles }
          Copy-Item -Recurse ui release-package\ui
          Compress-Archive -Path release-package\* -DestinationPath simc-windows.zip

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: simc-windows.zip
