name: Build Windows exe

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build
        run: msbuild simc_vs2026.sln /p:Configuration=Release /p:Platform=x64

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: simc-windows-build
          path: |
            **/*.exe
